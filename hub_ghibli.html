<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>腦脈先鋒｜微觀血管引擎</title>
<style>
  :root {
    --bg-dark: #000000; 
    --bg-light: #1a0202;
    --vessel-dark: #2d0b0b;
    --vessel-light: #8c2a2a;
    --vessel-edge: #ff8a8a;
    --thrombus-core: #2b0a0a;
    --theme-beg: #64b5f6;
    --theme-beg-glow: rgba(100, 181, 246, 0.8);
    --theme-adv: #ffd54f;
    --theme-adv-glow: rgba(255, 213, 79, 0.8);
    --current-theme: var(--theme-beg);
    --current-glow: var(--theme-beg-glow);
    --coin-gold: #ffd700;
  }

  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; font-family: "PingFang TC", sans-serif; user-select: none; -webkit-user-select: none; background: #000; }
  
  #game-window { position: absolute; inset: 0; overflow: hidden; }

  #bv-viewport {
      position: absolute; top: 0; bottom: 70px; left: 0; right: 0;
      background: radial-gradient(ellipse 150% 100% at 50% 50%, var(--bg-light) 0%, var(--bg-dark) 100%); 
      overflow: hidden;
  }

  .vessel-wall { 
      position: absolute; width: 100%; height: 65px; left: 0; z-index: 1; 
      background: #3a0d0d; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); 
  }
  .vessel-wall.top { top: 0; border-top: 2px solid rgba(255, 138, 138, 0.5); border-bottom: 5px solid rgba(255, 138, 138, 0.2); }
  .vessel-wall.bottom { bottom: 0; border-bottom: 2px solid rgba(255, 138, 138, 0.5); border-top: 5px solid rgba(255, 138, 138, 0.2); }
  .vessel-wall::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image: 
          repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.6) 3px, rgba(0,0,0,0.6) 6px), 
          repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(255,138,138,0.15) 15px, rgba(255,138,138,0.15) 18px); 
  }

  #world { 
      position: absolute; left: 0; top: 0; height: 100%; will-change: transform; z-index: 10; 
      transition: transform 0.05s linear;
  }

  #wall-container { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .endo-cell {
      position: absolute; width: 130px; height: 50px; border-radius: 25px !important; 
      background: radial-gradient(circle at 50% 50%, var(--vessel-light) 0%, var(--vessel-dark) 100%);
      border: 2px solid var(--vessel-edge) !important;
      z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .endo-cell.top { top: 25px; box-shadow: inset 0 -4px 8px rgba(0,0,0,0.6), 0 10px 18px rgba(0,0,0,0.7); }
  .endo-cell.bottom { bottom: 25px; box-shadow: inset 0 4px 8px rgba(0,0,0,0.6), 0 -10px 18px rgba(0,0,0,0.7); }

  .cell-text-title { font-size: 13px; font-weight: 900; color: #ffcdd2; line-height: 1.2; text-shadow: 1px 1px 2px #000; white-space: normal; text-align: center; padding: 0 4px; pointer-events: none;}

  .cell-node { 
      background: radial-gradient(circle at 50% 20%, #5d4037 0%, #3e2723 100%); 
      color: #aaa; text-shadow: 1px 1px 2px #000; transition: all 0.3s; z-index: 20; cursor: pointer; pointer-events: auto;
  }
  .node-locked { filter: grayscale(100%) brightness(0.6); }
  .node-active { 
      background: radial-gradient(circle at 50% 20%, #795548 0%, #4e342e 100%); 
      color: #fff; animation: activeCellPulse 2s infinite alternate ease-in-out; 
      border-color: var(--current-theme) !important;
  }
  @keyframes activeCellPulse { 0% { box-shadow: 0 5px 15px rgba(0,0,0,0.8), 0 0 15px var(--current-glow); } 100% { box-shadow: 0 10px 25px rgba(0,0,0,0.9), 0 0 35px var(--current-glow); } }
  
  .node-cleared {
      background: radial-gradient(circle at 50% 20%, #fff 0%, var(--current-theme) 100%) !important;
      color: #000 !important; border-color: #fff !important; text-shadow: 1px 1px 0 rgba(255,255,255,0.8) !important;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 0 40px var(--current-glow), inset 0 -3px 10px rgba(0,0,0,0.3) !important;
  }
  .active-hit { transform: scale(1.1) !important; background: #fff !important; box-shadow: 0 0 50px #fff !important; transition: all 0.1s !important; animation: none !important; }

  .special-node {
      height: 65px !important; 
      border-radius: 15px !important; 
      border-color: rgba(255, 255, 255, 0.4) !important;
  }
  .special-node-pulse { animation: specialPulse 3s infinite alternate ease-in-out; }
  @keyframes specialPulse { 
      0% { filter: brightness(0.8) saturate(0.8); } 
      100% { filter: brightness(1.1) saturate(1.1); box-shadow: 0 5px 15px rgba(0,0,0,0.8), 0 0 20px var(--glow-color); } 
  }

  .energy-orb {
      position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
      width: 14px; height: 14px; background: #00e676; border-radius: 50%;
      box-shadow: 0 0 10px #00e676, 0 0 20px #69f0ae;
      animation: orbFloat 1s infinite alternate ease-in-out;
      transition: opacity 0.2s;
  }
  @keyframes orbFloat { from { bottom: -24px; opacity: 0.8; } to { bottom: -16px; opacity: 1; } }

  /* ★ 擬真版巨型斑塊血栓 (主線用) */
  #massive-thrombus {
      position: absolute; top: 75px; bottom: 75px; right: 0; 
      /* 生物感的暗紅底色 (血栓基底) */
      background-color: #4a0e0e; 
      /* 不規則的脂質沉積與發炎組織交織 (不重複) */
      background-image: 
          radial-gradient(ellipse at 10% 40%, rgba(255, 235, 59, 0.6) 0%, transparent 60%),
          radial-gradient(ellipse at 80% 20%, rgba(245, 127, 23, 0.7) 0%, transparent 50%),
          radial-gradient(ellipse at 30% 80%, rgba(139, 42, 42, 0.8) 0%, transparent 60%),
          linear-gradient(135deg, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(0,0,0,0.6) 100%);
      /* 拔除 background-size 的名牌包重複設定，改為全版延伸 */
      background-size: cover; 
      /* 左側邊緣稍微圓潤，像是一坨腫脹的肉瘤塞住血管 */
      border-radius: 40px 0 0 40px;
      /* 邊緣改成不規則的發炎紅斑感，而非死板的橘線 */
      border-left: 4px solid #8c2a2a; 
      /* 陰影營造立體腫脹感 */
      box-shadow: inset 30px 0 40px rgba(0,0,0,0.8), -15px 0 35px rgba(0,0,0,0.8);
      z-index: 12;
  }
  #massive-thrombus::before { 
      content: ''; position: absolute; inset: 0; left:0; width: 40px; 
      background: linear-gradient(90deg, rgba(0, 230, 118, 0.9), transparent); 
      opacity: 0; transition: opacity 0.3s; pointer-events: none; 
      border-radius: 40px 0 0 40px; /* 跟隨父元素的圓潤感 */
  }
  #massive-thrombus.dissolving::before { opacity: 1; }

  .cell-track { position: absolute; left: 0; width: 200%; height: 50px; display: none; z-index: 5; will-change: transform; } 
  .cell-track.top { top: 25px; }
  .cell-track.bottom { bottom: 25px; }
  .cell-track .endo-cell { position: relative; left: auto; top: auto; bottom: auto; margin-right: 20px; }
  .cell-text { font-size: 11px; font-weight: 900; color: #ffcdd2; opacity: 0.3; text-align: center; }

  .pk-obstacle {
      position: absolute; display: none; left: 0; bottom: 75px;
      background-color: #5d4037; 
      background-image: radial-gradient(circle at 20% 30%, rgba(251, 192, 45, 0.8) 0%, transparent 50%), radial-gradient(circle at 70% 60%, rgba(245, 127, 23, 0.9) 0%, transparent 60%); 
      background-size: 40px 40px; border: 4px solid #f57f17; z-index: 12; 
      box-shadow: inset 10px 0 20px rgba(0,0,0,0.8), -10px 0 15px rgba(0,0,0,0.6); 
      border-radius: 40% 40% 10px 10px; border-bottom: none; 
      will-change: transform; visibility: hidden;
  }
  .pk-obs-top { bottom: auto; top: 75px; border-radius: 10px 10px 40% 40%; border-top: none; border-bottom: 4px solid #f57f17; }

  #effects-mask { position: absolute; inset: 0; overflow: hidden; z-index: 2; transition: clip-path 1.5s ease-in-out; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
  #light-zones-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .cleared-light-zone { position: absolute; top: 0; bottom: 0; background: radial-gradient(ellipse at center, rgba(138, 42, 42, 0.4) 0%, transparent 80%); filter: blur(20px); transition: opacity 1.5s ease-in-out; }

  #particles-container { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .red-blood-cell { position: absolute; width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, #ff5252 0%, #d32f2f 60%, #b71c1c 100%); border-radius: 50%; box-shadow: inset 0 0 10px rgba(100,0,0,0.8), 2px 4px 6px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;}
  .red-blood-cell::after { content: ''; width: 40%; height: 40%; border-radius: 50%; background: rgba(150,0,0,0.4); box-shadow: inset 2px 2px 4px rgba(0,0,0,0.5); }
  .rbc-slow { animation: floatRbcSlow 15s linear infinite; }
  @keyframes floatRbcSlow { 0% { transform: translateX(0) rotate(0deg); opacity: 0.5; } 100% { transform: translateX(300px) rotate(360deg); opacity: 0.5; } }
  .rbc-fast { animation: dashRbcFast 3s linear forwards; z-index: 15; }
  @keyframes dashRbcFast { 0% { transform: translateX(0) rotate(0deg) scale(1.2); opacity: 1; } 100% { transform: translateX(800px) rotate(360deg) scale(0.8); opacity: 0; } }

  /* 玩家 (奈米膠囊) */
  #player { 
      position: absolute; bottom: 75px; width: 28px; height: 45px; 
      z-index: 30; transform: translate(-50%, 0); will-change: transform;
      /* 一般探索時保留過渡動畫 */
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  /* 跑酷時移除 CSS 過渡，改用 JS 高頻控制 */
  .parkour-player { transition: none !important; }

  .capsule-body { width: 100%; height: 100%; border-radius: 20px; background: linear-gradient(180deg, #eceff1 50%, var(--current-theme) 50%); border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset -3px -3px 6px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
  .capsule-core { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: #888; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); transition: background 0.3s, box-shadow 0.3s; }
  .player-charged .capsule-core { background: #00e676; box-shadow: 0 0 10px #00e676, 0 0 20px #69f0ae; animation: corePulse 1s infinite alternate; }
  @keyframes corePulse { from { opacity: 0.6; } to { opacity: 1; box-shadow: 0 0 15px #69f0ae; } }

  .drop-in { animation: injectCapsule 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
  @keyframes injectCapsule { 0% { transform: translate(-50%, -120px) scale(0.2); opacity: 0; } 70% { transform: translate(-50%, -20px) scale(1.05); opacity: 1; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }

  .enzyme-beam { position: absolute; left: 100%; top: 25%; transform: translateY(-50%); width: 0; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #00e676, rgba(0, 230, 118, 0.8), transparent); box-shadow: 0 0 10px #00e676; opacity: 0; transition: width 0.3s, opacity 0.3s; z-index: 31; pointer-events: none; transform-origin: left center; }
  .player-firing .enzyme-beam { width: 120px; opacity: 1; animation: beamPulse 0.1s infinite alternate; }
  @keyframes beamPulse { from { opacity: 0.7; filter: brightness(1); } to { opacity: 1; filter: brightness(1.5); } }

  .health-coin { 
      position: absolute; display: none; 
      width: 30px; height: 30px; background: radial-gradient(circle, #69f0ae, #00b259); 
      border: 2px solid #fff; border-radius: 50%; align-items: center; justify-content: center; 
      color: #004d26; font-weight: 900; font-size: 16px; z-index: 25; 
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.7); animation: floatCoin 1.5s ease-in-out infinite alternate; 
  }
  .endo-cell .health-coin { position: relative; display: flex; left: auto !important; bottom: auto !important; top: auto; animation: none; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 0 15px rgba(0, 230, 118, 0.9); }
  .health-coin.collected { animation: collectEffect 0.5s ease-out forwards !important; pointer-events: none; display: flex !important;}
  @keyframes collectEffect { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }

  .pk-coin-wrapper { position: absolute; left: 0; top: 35px; visibility: hidden; will-change: transform; z-index: 25; }
  .pk-coin-wrapper .health-coin { position: relative; display: flex !important; animation: floatCoin 1s infinite alternate; }

  #control-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: transparent; z-index: 100; display: flex; justify-content: center; align-items: center; touch-action: none; transition: all 0.3s;}
  #virtual-controls { position: relative; width: 100%; max-width: 400px; height: 100%; pointer-events: none; }
  .v-btn { 
      pointer-events: auto; background: rgba(20, 20, 20, 0.4); 
      border: 1px solid rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.5); 
      border-radius: 50%; width: 52px; height: 52px; 
      font-size: 16px; font-weight: 900; display: flex; justify-content: center; align-items: center; 
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); 
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.4); 
      position: absolute; top: 50%; transform: translateY(-50%); 
      touch-action: none; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .v-btn:active, .v-btn.active { 
      background: rgba(0, 0, 0, 0.7); color: rgba(255,255,255,0.9); 
      border-color: rgba(255, 255, 255, 0.4); 
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.2); 
  }
  #btn-jump { left: 50%; transform: translate(-50%, -50%); width: 100px; border-radius: 26px; letter-spacing: 2px; }
  #btn-jump:active, #btn-jump.active { transform: translate(-50%, -50%) scale(0.92); border-color: var(--current-theme); box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 15px var(--current-glow); }
  #btn-left { left: 25px; } #btn-left:active { transform: translateY(-50%) scale(0.92); }
  #btn-right { right: 25px; } #btn-right:active { transform: translateY(-50%) scale(0.92); }

  #parkour-hud { position: absolute; top: 15px; left: 20px; right: 20px; display: none; justify-content: space-between; z-index: 100; color: #fff; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 2px #000; pointer-events: none;}
  #parkour-hud .val { color: #69f0ae; font-size: 22px; margin-left: 5px; }

  .pk-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px; backdrop-filter: blur(5px);}
  .pk-overlay h1 { font-size: 32px; margin-bottom: 10px; }
  .pk-overlay p { font-size: 16px; color: #ccc; margin-bottom: 20px; line-height: 1.5; }
  .pk-btn { padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; border: 2px solid #fff; cursor: pointer; transition: transform 0.1s; position: relative; pointer-events: auto; }
  .pk-btn:active { transform: scale(0.95); }
  .pk-btn-start { background: linear-gradient(135deg, #00e676, #00b259); color: #004d26; box-shadow: 0 5px 15px rgba(0,230,118,0.4); }
  .pk-btn-retry { background: #555; color: #fff; border-color: #888; }
</style>
</head>
<body>

<div id="game-window">
  <div id="bv-viewport">
      <div class="vessel-wall top"></div>
      <div class="vessel-wall bottom"></div>
      
      <div id="bg-cells-top" class="cell-track top"></div>
      <div id="bg-cells-bottom" class="cell-track bottom"></div>
      
      <div id="world">
        <div id="effects-mask">
            <div id="light-zones-container"></div>
            <div id="particles-container"></div>
        </div>
        
        <div id="massive-thrombus"></div>

        <div id="top-wall-container"></div>
        <div id="bottom-wall-container"></div>
        <div id="coins-container"></div>
        <div id="parkour-objects-container"></div> 
        
        <div id="player">
            <div class="enzyme-beam"></div>
            <div class="capsule-body"><div class="capsule-core"></div></div>
        </div>
      </div>
  </div>
  
  <div id="control-bar">
      <div id="virtual-controls">
          <div class="v-btn" id="btn-left">
              <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </div>
          <div class="v-btn" id="btn-jump">JUMP</div>
          <div class="v-btn" id="btn-right">
              <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </div>
      </div>
  </div>

  <div id="parkour-hud">
      <div>極速距離: <span id="pk-dist" class="val">0</span> m</div>
      <div>金幣: <span id="pk-coins" class="val">0</span></div>
  </div>

  <div id="parkour-start" class="pk-overlay">
      <h1 style="color:#00b0ff; text-shadow:0 0 15px rgba(0,176,255,0.5);">🏃 微觀血管跑酷</h1>
      <p>在空白血管裡極速衝刺！<br><br>⚠️ <b>求生法則：</b><br>點擊畫面跳過下方斑塊，貼地閃避上方斑塊<br>抓準時機吃掉上方的健康幣！</p>
      <button class="pk-btn pk-btn-start" onclick="startParkour()">極速啟動</button>
  </div>

  <div id="parkour-result" class="pk-overlay">
      <h1 style="color:#ff5252; text-shadow:0 0 15px rgba(255,82,82,0.5);">💥 發生碰撞</h1>
      <p style="font-size:20px;">極限距離: <span id="pk-final-dist" style="color:#fff;">0</span> m<br>收集金幣: <span id="pk-final-coins" style="color:#ffd700;">0</span> 幣</p>
      <div style="display:flex; gap:15px; margin-top:10px;">
          <button class="pk-btn pk-btn-retry" onclick="resetParkour()">再試一次</button>
          <button class="pk-btn pk-btn-start" onclick="exitParkour()">結算並離開</button>
      </div>
  </div>

</div>

<script>
  document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function(event) { event.preventDefault(); }, { passive: false });

  const player = document.getElementById('player');
  const world = document.getElementById('world');
  const topWallContainer = document.getElementById('top-wall-container');
  const bottomWallContainer = document.getElementById('bottom-wall-container');
  const massiveThrombus = document.getElementById('massive-thrombus');
  const lightZonesContainer = document.getElementById('light-zones-container');
  const coinsContainer = document.getElementById('coins-container');
  const pkObjectsContainer = document.getElementById('parkour-objects-container');
  const particlesContainer = document.getElementById('particles-container');
  const effectsMask = document.getElementById('effects-mask');
  const cellsTopTrack = document.getElementById('bg-cells-top');
  const cellsBottomTrack = document.getElementById('bg-cells-bottom');
  const btnJump = document.getElementById('btn-jump');
  
  let targetPlayerX = 150; 
  let playerX = 150; 
  let isJumping = false;
  let minPlayerX = 0; 
  let maxAllowedX = 5000; 
  let isAllCleared = false; 
  
  let isMovingLeft = false;
  let isMovingRight = false;
  
  const CELL_WIDTH = 130; 
  const CELLS_BETWEEN_NODES = 2; 
  const NODE_SPACING = CELL_WIDTH * CELLS_BETWEEN_NODES; 
  const START_OFFSET = CELL_WIDTH; 
  let WORLD_MAX_WIDTH = 5000;
  
  const nodesData = []; const coinsData = [];

  // === ★ 跑酷專用變數 ===
  let isParkourMode = false;
  let pkDistance = 0;
  let pkCoins = 0;
  let pkSpeed = 5.0; 
  let pkFrames = 0;
  let pkBgPos = 0;
  let pkPlayerY = 0; 
  let pkVelocityY = 0;
  const gravity = 1.0; // 跑酷重力

  const MAX_POOL_OBSTACLES = 6;
  const MAX_POOL_COINS = 4;
  let poolObstacles = [];
  let poolCoins = [];

  window.addEventListener('message', (event) => {
      if (event.data.type === 'RENDER_MAP') {
          const isAdv = event.data.mode === 'advanced';
          document.documentElement.style.setProperty('--current-theme', isAdv ? 'var(--theme-adv)' : 'var(--theme-beg)');
          document.documentElement.style.setProperty('--current-glow', isAdv ? 'var(--theme-adv-glow)' : 'var(--theme-beg-glow)');

          let activeIdx = event.data.activeIndex !== undefined ? event.data.activeIndex : (event.data.progressIndex || 0);
          isAllCleared = event.data.allCleared || false;
          let safeCoins = event.data.collectedCoins || [];
          let lastPlayedIdx = event.data.lastPlayedIndex; 
          let spawnIdx = event.data.spawnIndex;
          let attempts = event.data.challengeAttempts || { random: 3, comprehensive: 3, parkour: 3 };
buildWorld(event.data.baseSeq, safeCoins, activeIdx, isAllCleared, lastPlayedIdx, spawnIdx, attempts);      }
  });

  window.onload = () => {
      setTimeout(() => { if (nodesData.length === 0) autoBuildWorld(); }, 500); 
      setupVirtualControls();
      initParkourCells();
      createObjectsPool(); 
      requestAnimationFrame(gameLoop);
      window.parent.postMessage({ type: 'GHIBLI_HUB_READY' }, '*');
  };

  function autoBuildWorld() { buildWorld([], [], 0, false, null, 0, {random:3, comprehensive:3, parkour:3}); }

  function initParkourCells() {
      const numCells = Math.ceil(window.innerWidth / 150) + 2; 
      cellsTopTrack.innerHTML = ''; cellsBottomTrack.innerHTML = '';
      for(let i=0; i<numCells; i++) {
          cellsTopTrack.innerHTML += '<div class="endo-cell"><div class="cell-text">Endothelium</div></div>';
          cellsBottomTrack.innerHTML += '<div class="endo-cell"><div class="cell-text">Endothelium</div></div>';
      }
  }

  function createObjectsPool() {
      pkObjectsContainer.innerHTML = '';
      poolObstacles = []; poolCoins = [];
      
      for (let i = 0; i < MAX_POOL_OBSTACLES; i++) {
          const el = document.createElement('div'); el.className = 'pk-obstacle';
          pkObjectsContainer.appendChild(el);
          poolObstacles.push({ el: el, active: false, x: 0, w: 0, h: 0, isTop: false });
      }
      
      for (let i = 0; i < MAX_POOL_COINS; i++) {
          const wrapper = document.createElement('div'); wrapper.className = 'pk-coin-wrapper';
          const coin = document.createElement('div'); coin.className = 'health-coin'; coin.innerText = '$';
          wrapper.appendChild(coin);
          pkObjectsContainer.appendChild(wrapper);
          poolCoins.push({ wrapper: wrapper, coin: coin, active: false, x: 0 });
      }
  }

  function buildWorld(baseSeq, collectedCoins, activeIndex, allCleared, lastPlayedIdx, spawnIndex, attempts = {random: 3, comprehensive: 3, parkour: 3}) {
      if (!baseSeq || baseSeq.length === 0) return;

      topWallContainer.innerHTML = ''; bottomWallContainer.innerHTML = ''; 
      lightZonesContainer.innerHTML = ''; coinsContainer.innerHTML = '';
      nodesData.length = 0; coinsData.length = 0;

      const TOTAL_NODES = baseSeq.length; 
      let totalCellsNeeded = allCleared ? 57 : 1 + (TOTAL_NODES * CELLS_BETWEEN_NODES) + 2; 
      WORLD_MAX_WIDTH = totalCellsNeeded * CELL_WIDTH;
      world.style.width = WORLD_MAX_WIDTH + 'px';
      
      let taskMap = {}; 
      baseSeq.forEach((t, i) => { taskMap[START_OFFSET + i * NODE_SPACING] = { task: t, index: i }; });

      let blankCellIdx = 0; 

      for (let i = 0; i < totalCellsNeeded; i++) {
          let cellX = i * CELL_WIDTH;
          let cellW = 130; 

          let isSpecial = false; let specialData = null;
          if (allCleared) {
              // ★ 統一寬度為 115px (總寬345px剛好完美塞入手機螢幕不被切斷)
              if (i === 52) { isSpecial = true; specialData = { type: 'random', title: '隨機演練', icon: '🎲', color: '#8e24aa' }; cellW = 115; cellX = 52 * CELL_WIDTH; } 
              if (i === 53) { isSpecial = true; specialData = { type: 'comprehensive', title: '綜合演練', icon: '🛡️', color: '#e65100' }; cellW = 115; cellX = 52 * CELL_WIDTH + 115; } 
              if (i === 54) { isSpecial = true; specialData = { type: 'parkour', title: '跑酷挑戰', icon: '🏃', color: '#0277bd' }; cellW = 115; cellX = 52 * CELL_WIDTH + 230; } 
              if (i === 55) { cellX = 52 * CELL_WIDTH + 345; }
              if (i === 56) { cellX = 52 * CELL_WIDTH + 475; }
          }

          const bCell = document.createElement('div');
          bCell.className = 'endo-cell bottom'; bCell.style.left = cellX + 'px';
          bCell.style.width = cellW + 'px'; 
          
          if (taskMap[cellX]) {
              const tData = taskMap[cellX]; const t = tData.task;
              let titleColor = (t.status === 'locked') ? '#757575' : ((t.status === 'cleared') ? '#fff' : 'var(--current-theme)');
              bCell.innerHTML = `<div class="cell-text-title" style="color:${titleColor}">${t.title || '任務'}</div>`;
          } else if (isSpecial) {
              // ★ 把 End-Game 換成動態顯示剩餘次數
              let remain = attempts[specialData.type] !== undefined ? attempts[specialData.type] : 3;
              // ★ 改成低調的藍灰色與暗紅色
              let numColor = remain > 0 ? '#90a4ae' : '#8c2a2a'; 
              
              bCell.innerHTML = `
                  <div style="font-size: 11px; color: #777; margin-bottom: 2px; font-weight:bold;">今日剩餘</div>
                  <div style="font-size: 16px; font-weight: 900; color: ${numColor}; text-shadow: 1px 1px 2px #000;">${remain} 次</div>
              `;
          }
          bottomWallContainer.appendChild(bCell);


          if (taskMap[cellX]) {
              const tData = taskMap[cellX]; const t = tData.task; const displayNum = t.taskIdx + 1; 
              const node = document.createElement('div');
              node.className = 'endo-cell top cell-node'; node.style.left = cellX + 'px';
              node.style.width = cellW + 'px';
              
              if (t.status === 'cleared') { node.classList.add('node-cleared'); node.style.color = "#000"; }
              else if (t.status === 'active' || t.status === 'unlocked') { node.classList.add('node-active'); node.innerHTML += `<div class="energy-orb"></div>`; }
              else node.classList.add('node-locked');

              node.innerHTML += `<div style="font-size: 10px; opacity: 0.8; margin-bottom: 2px;">${t.category || '演練'}</div><div style="font-size: 15px; font-weight: 900; letter-spacing: 1px;">第 ${displayNum} 關</div>`;
              topWallContainer.appendChild(node);
              nodesData.push({ x: cellX, element: node, itemData: t });

          } else if (isSpecial) {
              const node = document.createElement('div');
              node.className = 'endo-cell top cell-node special-node special-node-pulse'; 
              node.style.left = cellX + 'px';
              node.style.width = cellW + 'px';
              node.style.setProperty('--glow-color', specialData.color);
              node.style.background = `radial-gradient(circle at 50% 30%, ${specialData.color} 0%, #1a1a1a 120%)`; 
              
              node.innerHTML = `<div style="font-size: 24px; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">${specialData.icon}</div><div style="font-size: 13px; font-weight: 900; letter-spacing: 1px; color:#fff; text-shadow: 1px 1px 2px #000; line-height: 1;">${specialData.title}</div>`;
              topWallContainer.appendChild(node);
              nodesData.push({ x: cellX, element: node, itemData: { type: specialData.type, status: 'unlocked' } });
              
          } else {
              const tCell = document.createElement('div');
              tCell.className = 'endo-cell top'; tCell.style.left = cellX + 'px';
              tCell.style.width = cellW + 'px';
              
              if (!allCleared || i < 50) {
                  let originalCellX = i * CELL_WIDTH; 
                  if (!collectedCoins.includes(blankCellIdx) && originalCellX <= START_OFFSET + activeIndex * NODE_SPACING) {
                      const coin = document.createElement('div'); coin.className = 'health-coin'; coin.innerText = '$';
                      tCell.appendChild(coin);
                      coinsData.push({ id: blankCellIdx, x: cellX + (cellW/2), element: coin, isCollected: false });
                  }
                  blankCellIdx++; 
              }
              topWallContainer.appendChild(tCell);
          }
      }

      let finalThrombusLeft = allCleared ? WORLD_MAX_WIDTH : (START_OFFSET + activeIndex * NODE_SPACING + 115);
      let initialThrombusLeft = finalThrombusLeft;

      if (lastPlayedIdx !== undefined && lastPlayedIdx !== null) {
          initialThrombusLeft = START_OFFSET + lastPlayedIdx * NODE_SPACING + 115;
          let startDropX = START_OFFSET + lastPlayedIdx * NODE_SPACING + 65; 
          targetPlayerX = startDropX; playerX = startDropX; maxAllowedX = startDropX; 

          massiveThrombus.style.transition = 'none'; effectsMask.style.transition = 'none';
          massiveThrombus.style.left = initialThrombusLeft + 'px'; effectsMask.style.clipPath = `polygon(0 0, ${initialThrombusLeft}px 0, ${initialThrombusLeft}px 100%, 0 100%)`;
          massiveThrombus.offsetHeight; 
          massiveThrombus.style.transition = 'left 2s cubic-bezier(0.4, 0, 0.2, 1)'; effectsMask.style.transition = 'clip-path 2s cubic-bezier(0.4, 0, 0.2, 1)';

          player.classList.remove('player-charged'); player.classList.add('drop-in');

          setTimeout(() => {
              player.classList.remove('drop-in'); player.classList.add('player-charged');
              setTimeout(() => {
                  player.classList.add('player-firing'); massiveThrombus.classList.add('dissolving');
                  setTimeout(() => {
                      massiveThrombus.style.left = finalThrombusLeft + 'px'; effectsMask.style.clipPath = `polygon(0 0, ${finalThrombusLeft}px 0, ${finalThrombusLeft}px 100%, 0 100%)`;
                      const lightZone = document.createElement('div'); lightZone.className = 'cleared-light-zone'; lightZone.style.left = (START_OFFSET + lastPlayedIdx * NODE_SPACING) + 'px'; lightZone.style.width = NODE_SPACING + 'px'; lightZonesContainer.appendChild(lightZone);

                      setTimeout(() => {
                          player.classList.remove('player-firing'); player.classList.remove('player-charged'); massiveThrombus.classList.remove('dissolving');
                          if (allCleared) {
                              maxAllowedX = WORLD_MAX_WIDTH; 
                              let finalTargetX = 52 * CELL_WIDTH + 172; 
                              targetPlayerX = finalTargetX; generateFastRBCs(startDropX, finalTargetX); 
                          } else {
                              maxAllowedX = START_OFFSET + activeIndex * NODE_SPACING + 65; let finalTargetX = maxAllowedX; 
                              targetPlayerX = finalTargetX; generateFastRBCs(startDropX, finalTargetX); 
                          }
                      }, 2000); 
                  }, 400); 
              }, 600); 
          }, 800); 
      } else {
          if (allCleared) {
              let startX = 52 * CELL_WIDTH + 172; targetPlayerX = startX; playerX = startX; maxAllowedX = WORLD_MAX_WIDTH; 
          } else {
              spawnIndex = spawnIndex !== undefined ? spawnIndex : activeIndex;
              let startX = START_OFFSET + spawnIndex * NODE_SPACING + 65; targetPlayerX = startX; playerX = startX; maxAllowedX = START_OFFSET + activeIndex * NODE_SPACING + 65; 
          }
          massiveThrombus.style.transition = 'none'; massiveThrombus.style.left = finalThrombusLeft + 'px'; effectsMask.style.transition = 'none'; effectsMask.style.clipPath = `polygon(0 0, ${finalThrombusLeft}px 0, ${finalThrombusLeft}px 100%, 0 100%)`;
      }
      generateParticles(WORLD_MAX_WIDTH); 
  }

  // === ★ 跑酷核心系統 ===
  function initParkour() {
      window.parent.postMessage({ type: 'START_PARKOUR' }, '*');
      document.getElementById('btn-left').style.opacity = '0';
      document.getElementById('btn-right').style.opacity = '0';
      document.getElementById('btn-jump').style.width = '180px';
      document.getElementById('parkour-start').style.display = 'flex';
  }

  function startParkour() {
      document.getElementById('parkour-start').style.display = 'none';
      document.getElementById('parkour-result').style.display = 'none';
      document.getElementById('parkour-hud').style.display = 'flex';
      
      topWallContainer.style.display = 'none'; bottomWallContainer.style.display = 'none';
      massiveThrombus.style.display = 'none'; lightZonesContainer.style.display = 'none'; coinsContainer.style.display = 'none';
      cellsTopTrack.style.display = 'flex'; cellsBottomTrack.style.display = 'flex';
      
      isParkourMode = true; pkDistance = 0; pkCoins = 0; 
      pkSpeed = 5.0; pkFrames = 0; pkBgPos = 0;
      pkPlayerY = 0; pkVelocityY = 0; isJumping = false; // ★ 重置獨立物理引擎
      
      // ★ 移除 CSS 過渡，改用 JS 物理引擎控制
      player.classList.add('parkour-player');
      
      poolObstacles.forEach(o => { o.active = false; o.el.style.visibility = 'hidden'; });
      poolCoins.forEach(c => { c.active = false; c.wrapper.style.visibility = 'hidden'; c.coin.classList.remove('collected'); });
      
      playerX = 60; targetPlayerX = 60;
      world.style.transform = `translate3d(0px, 0, 0)`;
      player.style.left = `60px`;
      player.style.transform = `translate(-50%, 0px)`;
      
      updateParkourUI();
  }

  function resetParkour() {
      player.style.filter = 'none';
      startParkour();
  }

  function exitParkour() {
      document.getElementById('parkour-result').style.display = 'none';
      document.getElementById('parkour-hud').style.display = 'none';
      
      document.getElementById('btn-left').style.opacity = '1';
      document.getElementById('btn-right').style.opacity = '1';
      document.getElementById('btn-jump').style.width = '95px';
      
      topWallContainer.style.display = 'block'; bottomWallContainer.style.display = 'block';
      massiveThrombus.style.display = 'block'; lightZonesContainer.style.display = 'block'; coinsContainer.style.display = 'block';
      cellsTopTrack.style.display = 'none'; cellsBottomTrack.style.display = 'none';
      
      isParkourMode = false;
      player.style.filter = 'none';
      
      // ★ 恢復 CSS 過渡動畫，並重置物理數據
      player.classList.remove('parkour-player');
      isJumping = false;
      
      poolObstacles.forEach(o => o.el.style.visibility = 'hidden'); 
      poolCoins.forEach(c => c.wrapper.style.visibility = 'hidden'); 
      
      let snapX = 52 * CELL_WIDTH + 155;
      targetPlayerX = snapX; playerX = snapX; maxAllowedX = WORLD_MAX_WIDTH;
      
      if (pkCoins > 0) window.parent.postMessage({ type: 'ADD_COINS', amount: pkCoins }, '*');
      window.parent.postMessage({ type: 'GAME_CLEAR', score: Math.floor(pkDistance) }, '*');
  }

  function updateParkourUI() {
      document.getElementById('pk-dist').innerText = Math.floor(pkDistance);
      document.getElementById('pk-coins').innerText = pkCoins;
  }

  function spawnParkourObjects() {
      let spawnInterval = Math.max(70, 160 - Math.floor(pkFrames / 25)); 
      if (pkFrames > 120 && pkFrames % spawnInterval === 0) {
          let allowTop = pkFrames > 720;
          let isTop = allowTop ? Math.random() > 0.6 : false; 
          
          const obs = poolObstacles.find(o => !o.active);
          if (obs) {
              obs.active = true; obs.isTop = isTop;
              
              const vh = document.getElementById('bv-viewport').offsetHeight;
              const maxH = (vh - 150) * 0.45; const minH = (vh - 150) * 0.25;
              const h = minH + Math.random() * (maxH - minH);
              const w = 35 + Math.random() * 20;
              
              obs.w = w; obs.h = h;
              obs.x = window.innerWidth + 50; 
              
              obs.el.className = `pk-obstacle ${isTop ? 'pk-obs-top' : 'pk-obs-bottom'}`;
              obs.el.style.width = w + 'px'; obs.el.style.height = h + 'px';
              obs.el.style.transform = `translate3d(${obs.x}px, 0, 0)`;
              obs.el.style.visibility = 'visible';
          }
      }
      
      if (pkFrames > 150 && pkFrames % 130 === 0) {
          const coin = poolCoins.find(c => !c.active);
          if (coin) {
              coin.active = true; coin.x = window.innerWidth + 50;
              coin.wrapper.style.transform = `translate3d(${coin.x}px, 0, 0)`;
              coin.wrapper.style.visibility = 'visible';
              coin.coin.classList.remove('collected');
          }
      }
  }

  function setupVirtualControls() {
      const btnLeft = document.getElementById('btn-left'); const btnRight = document.getElementById('btn-right');
      const addHoldEvent = (el, setTrue, setFalse) => { el.addEventListener('pointerdown', (e) => { e.preventDefault(); setTrue(); }); el.addEventListener('pointerup', (e) => { e.preventDefault(); setFalse(); }); el.addEventListener('pointercancel', (e) => { e.preventDefault(); setFalse(); }); el.addEventListener('pointerleave', (e) => { e.preventDefault(); setFalse(); }); };
      addHoldEvent(btnLeft, () => { if(!isParkourMode) isMovingLeft = true; }, () => isMovingLeft = false);
      addHoldEvent(btnRight, () => { if(!isParkourMode) isMovingRight = true; }, () => isMovingRight = false);
      
      document.addEventListener('pointerdown', (e) => {
          if (e.target.tagName !== 'BUTTON' && !e.target.closest('.v-btn')) { doJump(); }
      });
      btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); doJump(); });
  }

  // ★ 統一的跳躍指令入口
  function doJump() {
      if (isJumping) return;
      isJumping = true;
      btnJump.classList.add('active');
      
      const vh = document.getElementById('bv-viewport').offsetHeight;
      let maxJ = vh - 150 - 45 + 15; 
      if (maxJ < 90) maxJ = 90; 

      if (isParkourMode) {
          // 跑酷：套用重力物理
          pkVelocityY = Math.sqrt(2 * gravity * maxJ);
      } else {
          // 一般探索：套用 CSS 動畫
          player.style.transform = `translate(-50%, -${maxJ}px) scale(1.2)`;
          
          setTimeout(() => {
              nodesData.forEach(b => {
                  if (Math.abs(playerX - (b.x + 65)) < 70) {
                      b.element.classList.add('active-hit'); 
                      let orb = b.element.querySelector('.energy-orb'); if(orb) orb.style.opacity = '0';

                      setTimeout(() => {
                          window.parent.postMessage({
                              type: 'HUB_NODE_CLICK', nodeType: b.itemData.type, roleId: b.itemData.roleId, taskIdx: b.itemData.taskIdx, globalIdx: b.itemData.globalIdx, status: b.itemData.status
                          }, '*');
                          b.element.classList.remove('active-hit'); 
                      }, 400);
                  }
              });

              coinsData.forEach(c => {
                  if (!c.isCollected && Math.abs(playerX - c.x) < 60) {
                      c.isCollected = true; c.element.classList.add('collected'); 
                      window.parent.postMessage({ type: 'COLLECT_HUB_COIN', coinIndex: c.id }, '*');
                      setTimeout(() => { if (c.element.parentNode) c.element.parentNode.removeChild(c.element); }, 500);
                  }
              });
          }, 300);

          setTimeout(() => {
              if(!isParkourMode) {
                  player.style.transform = 'translate(-50%, 0) scale(1)';
                  setTimeout(() => { isJumping = false; btnJump.classList.remove('active'); }, 150); 
              }
          }, 400); 
      }
  }

  function gameLoop() {
      if (isParkourMode) {
          // --- ★ 跑酷迴圈 (獨立物理) ---
          pkFrames++;
          pkDistance += pkSpeed * 0.015;
          if (pkFrames % 300 === 0) pkSpeed += 0.3; 
          
          spawnParkourObjects(); 
          updateParkourUI();
          
          pkBgPos -= pkSpeed; 
          if(pkBgPos <= -150) pkBgPos += 150; 
          cellsTopTrack.style.transform = `translate3d(${pkBgPos}px, 0, 0)`;
          cellsBottomTrack.style.transform = `translate3d(${pkBgPos}px, 0, 0)`;
          
          // 純 JS 物理跳躍 (不依賴 CSS)
          if (isJumping) {
              pkPlayerY += pkVelocityY;
              pkVelocityY -= gravity;
              if (pkPlayerY <= 0) {
                  pkPlayerY = 0; pkVelocityY = 0; isJumping = false;
                  btnJump.classList.remove('active');
              }
              player.style.transform = `translate(-50%, -${pkPlayerY}px)`;
          }
          
          const vh = document.getElementById('bv-viewport').offsetHeight;
          const maxJ = vh - 150 - 45 + 15; 
          const pLeft = 60 - 14, pRight = 60 + 14;
          
          for (let i = poolObstacles.length - 1; i >= 0; i--) {
              let o = poolObstacles[i];
              if (!o.active) continue;
              
              o.x -= pkSpeed;
              o.el.style.transform = `translate3d(${o.x}px, 0, 0)`; 
              
              if (o.x < -100) { 
                  o.active = false; o.el.style.visibility = 'hidden'; 
              } 
              else {
                  let hitX = pRight > (o.x + 5) && pLeft < (o.x + o.w - 5);
                  let hitY = false;
                  
                  if (o.isTop) {
                      hitY = (pkPlayerY + 45 - 10) > (vh - 150 - o.h); 
                  } else {
                      hitY = (pkPlayerY + 10) < o.h;
                  }
                  
                  if (hitX && hitY) {
                      isParkourMode = false;
                      document.getElementById('pk-final-dist').innerText = Math.floor(pkDistance);
                      document.getElementById('pk-final-coins').innerText = pkCoins;
                      document.getElementById('parkour-result').style.display = 'flex';
                      player.style.filter = 'brightness(1.5) drop-shadow(0 0 20px red) sepia(1) hue-rotate(-50deg) saturate(5)';
                  }
              }
          }
          
          for (let i = poolCoins.length - 1; i >= 0; i--) {
              let c = poolCoins[i];
              if (!c.active) continue;
              
              c.x -= pkSpeed;
              c.wrapper.style.transform = `translate3d(${c.x}px, 0, 0)`;

              if (c.x < -100) { 
                  c.active = false; c.wrapper.style.visibility = 'hidden'; 
              } 
              else if (!c.coin.classList.contains('collected')) {
                  let hitX = pRight > c.x && pLeft < (c.x + 30);
                  let hitY = pkPlayerY > (maxJ * 0.6); 
                  
                  if (hitX && hitY) {
                      pkCoins++; updateParkourUI();
                      c.coin.classList.add('collected'); 
                      setTimeout(() => { if (c.active) { c.active = false; c.wrapper.style.visibility = 'hidden'; } }, 500);
                  }
              }
          }
      } else {
          // --- 一般探索邏輯 ---
          if (isMovingLeft) targetPlayerX -= 8;
          if (isMovingRight) targetPlayerX += 8;
          
          if (isAllCleared) {
              if (targetPlayerX > 7400) { 
                  targetPlayerX = 50; playerX = 50; 
                  world.style.transition = 'none'; world.offsetHeight; world.style.transition = 'transform 0.05s linear'; 
              } 
              else if (targetPlayerX < 0) { 
                  targetPlayerX = 7330; playerX = 7330; 
                  world.style.transition = 'none'; world.offsetHeight; world.style.transition = 'transform 0.05s linear';
              }
          } else {
              if (targetPlayerX < minPlayerX) targetPlayerX = minPlayerX; 
              if (targetPlayerX > maxAllowedX) targetPlayerX = maxAllowedX; 
          }

          if (!isNaN(targetPlayerX)) {
              playerX += (targetPlayerX - playerX) * 0.15; 
              let camX = (window.innerWidth / 2) - playerX; 
              if (camX > 0) camX = 0; 
              const maxScroll = -(WORLD_MAX_WIDTH - window.innerWidth + 100);
              if (camX < maxScroll) camX = maxScroll; 
              
              world.style.transform = `translate3d(${camX}px, 0, 0)`;
              player.style.left = `${playerX}px`;
          }
      }
      
      requestAnimationFrame(gameLoop);
  }

  function generateParticles(brightLimitX) {
      const pContainer = document.getElementById('particles-container'); pContainer.innerHTML = '';
      for(let i=0; i<15; i++) { 
          const rbc = document.createElement('div'); rbc.className = 'red-blood-cell rbc-slow'; rbc.style.left = `${Math.random() * brightLimitX}px`; rbc.style.top = `${30 + Math.random() * 35}%`; 
          const size = 15 + Math.random() * 20; rbc.style.width = `${size}px`; rbc.style.height = `${size}px`; rbc.style.animationDuration = `${10 + Math.random() * 10}s`; rbc.style.animationDelay = `-${Math.random() * 10}s`; pContainer.appendChild(rbc); 
      }
  }

  function generateFastRBCs(startX, endX) {
      for(let i=0; i<10; i++) {
          setTimeout(() => {
              const rbc = document.createElement('div'); rbc.className = 'red-blood-cell rbc-fast'; rbc.style.left = `${startX - 100}px`; rbc.style.top = `${40 + Math.random() * 25}%`; rbc.style.animationDuration = `${1 + Math.random() * 1}s`; document.getElementById('particles-container').appendChild(rbc);
              setTimeout(() => { if (rbc.parentNode) rbc.parentNode.removeChild(rbc); }, 3000);
          }, i * 200);
      }
  }
</script>
</body>
