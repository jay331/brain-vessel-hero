<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>腦脈先鋒｜微觀血管引擎</title>
<style>
  :root {
    --bg-dark: #000000; 
    --bg-light: #1a0202;
    --vessel-dark: #2d0b0b;
    --vessel-light: #8c2a2a;
    --vessel-edge: #ff8a8a;
    --thrombus-core: #2b1713;
    --thrombus-edge: #4e2920;
    --theme-beg: #64b5f6;
    --theme-beg-glow: rgba(100, 181, 246, 0.8);
    --theme-adv: #ffd54f;
    --theme-adv-glow: rgba(255, 213, 79, 0.8);
    --current-theme: var(--theme-beg);
    --current-glow: var(--theme-beg-glow);
    --coin-gold: #ffd700;
  }

  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; font-family: "PingFang TC", sans-serif; user-select: none; -webkit-user-select: none; background: #000; }
  
  #game-window { position: absolute; inset: 0; overflow: hidden; }

  /* === 上半部：血管遊戲視角區 (深邃管腔的 3D 漸層) === */
  #bv-viewport {
      position: absolute; top: 0; bottom: 60px; left: 0; right: 0;
      background: radial-gradient(ellipse 150% 100% at 50% 50%, var(--bg-light) 0%, var(--bg-dark) 100%); 
      overflow: hidden;
  }

  /* === ★ 加強後的血管外層肌肉組織 (The Outer Wall) === */
  .vessel-wall { 
      position: absolute; width: 100%; height: 100px; /* ★ 加厚外壁組織 */
      left: 0; z-index: 1; 
      box-shadow: 0 0 35px rgba(0,0,0,0.95); 
  }
  .vessel-wall.top { 
      top: 0; 
      background: linear-gradient(to bottom, #000 0%, #1a0505 50%, var(--vessel-dark) 100%);
      border-bottom: 5px solid rgba(255, 138, 138, 0.2); 
  }
  .vessel-wall.bottom { 
      bottom: 0; 
      background: linear-gradient(to top, #000 0%, #1a0505 50%, var(--vessel-dark) 100%);
      border-top: 5px solid rgba(255, 138, 138, 0.2); 
  }
  /* === ★ 清晰的肌肉束與微血管網紋理 === */
  .vessel-wall::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image: 
          repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.5) 3px, rgba(0,0,0,0.5) 6px), /* ★ 肌肉紋理加清晰 */
          repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,138,138,0.05) 20px, rgba(255,138,138,0.05) 22px); /* ★ 微血管網加強 */
  }

  #world { 
      position: absolute; left: 0; top: 0; height: 100%; will-change: transform; z-index: 10; 
      transition: transform 0.05s linear;
  }

  /* === 懸浮的內皮細胞層 (往管腔內縮，展現立體感) === */
  #wall-container { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .endo-cell {
      position: absolute; 
      width: 130px;  
      height: 50px;  
      border-radius: 25px !important; 
      background: radial-gradient(circle at 50% 50%, var(--vessel-light) 0%, var(--vessel-dark) 100%);
      border: 2px solid var(--vessel-edge) !important;
      z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  
  /* 距離邊界 50px，讓外壁組織可以被看見，並加上更強懸浮陰影 */
  .endo-cell.top { 
      top: 50px; 
      box-shadow: inset 0 -4px 8px rgba(0,0,0,0.6), 0 10px 18px rgba(0,0,0,0.7); 
  }
  .endo-cell.bottom { 
      bottom: 50px; 
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.6), 0 -10px 18px rgba(0,0,0,0.7); 
  }

  /* 下壁細胞文字 */
  .cell-text-title { font-size: 13px; font-weight: 900; color: #ffcdd2; line-height: 1.2; text-shadow: 1px 1px 2px #000; white-space: normal; text-align: center; padding: 0 4px; pointer-events: none;}

  /* 關卡節點 (特殊的變異細胞) */
  .cell-node { 
      background: radial-gradient(circle at 50% 20%, #5d4037 0%, #3e2723 100%); 
      color: #aaa; text-shadow: 1px 1px 2px #000; 
      transition: all 0.3s; z-index: 20; cursor: pointer; pointer-events: auto;
  }
  .node-locked { filter: grayscale(100%) brightness(0.6); }
  .node-active { 
      background: radial-gradient(circle at 50% 20%, #795548 0%, #4e342e 100%); 
      color: #fff; animation: activeCellPulse 2s infinite alternate ease-in-out; 
      border-color: var(--current-theme) !important;
  }
  @keyframes activeCellPulse { 
      0% { box-shadow: 0 5px 15px rgba(0,0,0,0.8), 0 0 15px var(--current-glow); } 
      100% { box-shadow: 0 10px 25px rgba(0,0,0,0.9), 0 0 35px var(--current-glow); } 
  }
  .node-cleared {
      background: radial-gradient(circle at 50% 20%, #fff 0%, var(--current-theme) 100%) !important;
      color: #000 !important; border-color: #fff !important; text-shadow: 1px 1px 0 rgba(255,255,255,0.8) !important;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 0 40px var(--current-glow), inset 0 -3px 10px rgba(0,0,0,0.3) !important;
  }
  .active-hit { transform: scale(1.1) !important; background: #fff !important; box-shadow: 0 0 50px #fff !important; transition: all 0.1s !important; animation: none !important; }

  /* 完全阻塞的巨大血栓 */
  .thrombus-block {
      /* 頂著上下內皮細胞的邊緣 (50 + 50 = 100px) */
      position: absolute; top: 100px; bottom: 100px; 
      width: 70px; background: repeating-linear-gradient(45deg, var(--thrombus-core), var(--thrombus-core) 10px, var(--thrombus-edge) 10px, var(--thrombus-edge) 20px);
      border-left: 3px solid #111; border-right: 3px solid #111; border-radius: 8px;
      z-index: 12; opacity: 1;
      box-shadow: -15px 0 30px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.9);
      display: flex; align-items: center; justify-content: center; overflow: hidden; transition: width 1.5s ease-in-out, opacity 1.5s ease-in-out;
  }
  .thrombus-block::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 10px 10px; pointer-events: none; }
  .thrombus-cleared { width: 0 !important; opacity: 0 !important; border: none !important; box-shadow: none !important; }

  /* 裁切遮罩與光暈 */
  #effects-mask { position: absolute; inset: 0; overflow: hidden; z-index: 2; transition: clip-path 1.5s ease-in-out; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
  #light-zones-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .cleared-light-zone { position: absolute; top: 0; bottom: 0; background: radial-gradient(ellipse at center, rgba(138, 42, 42, 0.4) 0%, transparent 80%); filter: blur(20px); transition: opacity 1.5s ease-in-out; }

  /* 微觀粒子與血球 */
  #particles-container { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .red-blood-cell { position: absolute; width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, #ff5252 0%, #d32f2f 60%, #b71c1c 100%); border-radius: 50%; box-shadow: inset 0 0 10px rgba(100,0,0,0.8), 2px 4px 6px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;}
  .red-blood-cell::after { content: ''; width: 40%; height: 40%; border-radius: 50%; background: rgba(150,0,0,0.4); box-shadow: inset 2px 2px 4px rgba(0,0,0,0.5); }
  .rbc-slow { animation: floatRbcSlow 15s linear infinite; }
  @keyframes floatRbcSlow { 0% { transform: translateX(0) rotate(0deg); opacity: 0.5; } 100% { transform: translateX(300px) rotate(360deg); opacity: 0.5; } }
  .rbc-fast { animation: dashRbcFast 3s linear forwards; z-index: 15; }
  @keyframes dashRbcFast { 0% { transform: translateX(0) rotate(0deg) scale(1.2); opacity: 1; } 100% { transform: translateX(800px) rotate(360deg) scale(0.8); opacity: 0; } }

  /* ★ 玩家 (奈米膠囊) - 修正高度與跳躍流暢度 */
  #player { 
      position: absolute; 
      bottom: 98px; /* ★ 再調高 8px，不陷底 (50 + 50 = 100px - 2px) */
      transform: translateX(-50%); width: 28px; height: 45px; 
      z-index: 30; 
      transition: transform 0.5s cubic-bezier(0.1, 0.7, 0.1, 1); /* ★ 優化曲線，提升流暢度 */
      will-change: left, transform; 
  }
  .capsule-body {
      width: 100%; height: 100%; border-radius: 20px; background: linear-gradient(180deg, #eceff1 50%, var(--current-theme) 50%);
      border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset -3px -3px 6px rgba(0,0,0,0.3); position: relative; overflow: hidden;
  }
  .capsule-core { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: #00e676; border-radius: 50%; box-shadow: 0 0 10px #00e676; animation: corePulse 1s infinite alternate; }
  @keyframes corePulse { from { opacity: 0.5; } to { opacity: 1; box-shadow: 0 0 15px #69f0ae; } }
  .drop-in { animation: injectCapsule 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
  @keyframes injectCapsule { 0% { transform: translate(-200px, 200px) scale(0.5); opacity: 0; } 100% { transform: translate(0, 0) scale(1); opacity: 1; } }

  .health-coin { position: absolute; width: 30px; height: 30px; background: radial-gradient(circle, var(--coin-gold), #b8860b); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #8b4513; font-weight: bold; font-size: 16px; z-index: 25; box-shadow: 0 0 10px rgba(255,215,0,0.7); animation: floatCoin 1.5s ease-in-out infinite alternate; }
  @keyframes floatCoin { 0% { transform: translateY(0px); } 100% { transform: translateY(-8px); } }
  .health-coin.collected { animation: collectEffect 0.5s ease-out forwards; pointer-events: none; }
  @keyframes collectEffect { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }

  /* 獨立的虛擬控制台 (極簡低調) */
  #control-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 60px; 
      background: transparent; z-index: 100; display: flex; justify-content: center; align-items: center;
      touch-action: none;
  }
  #virtual-controls { position: relative; width: 100%; max-width: 400px; height: 100%; pointer-events: none; }
  
  .v-btn {
      pointer-events: auto; 
      background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); 
      color: rgba(255, 255, 255, 0.4); border-radius: 50%;
      width: 46px; height: 46px; font-size: 18px; font-weight: bold;
      display: flex; justify-content: center; align-items: center;
      backdrop-filter: blur(2px); box-shadow: none;
      position: absolute; top: 50%; transform: translateY(-50%); touch-action: none;
  }
  .v-btn:active { background: rgba(0, 0, 0, 0.6); color: rgba(255,255,255,0.8); border-color: rgba(255, 255, 255, 0.3); }
  #btn-left { left: 25px; } #btn-left:active { transform: translateY(-50%) scale(0.92); }
  #btn-right { right: 25px; } #btn-right:active { transform: translateY(-50%) scale(0.92); }
  
  #btn-jump { 
      left: 50%; transform: translate(-50%, -50%); width: 95px; border-radius: 20px; 
      font-size: 15px; letter-spacing: 2px; 
      background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.6); box-shadow: none; 
  }
  #btn-jump:active { transform: translate(-50%, -50%) scale(0.92); background: rgba(0, 0, 0, 0.7); color: #fff; border-color: var(--current-theme); }
</style>
</head>
<body>

<div id="game-window">
  
  <div id="bv-viewport">
      <div class="vessel-wall top"></div>
      <div class="vessel-wall bottom"></div>
      
      <div id="world">
        <div id="effects-mask">
            <div id="light-zones-container"></div>
            <div id="particles-container"></div>
        </div>
        
        <div id="top-wall-container"></div>
        <div id="bottom-wall-container"></div>
        <div id="thrombus-container"></div>
        <div id="coins-container"></div>
        
        <div id="player">
            <div class="capsule-body"><div class="capsule-core"></div></div>
        </div>
      </div>
  </div>
  
  <div id="control-bar">
      <div id="virtual-controls">
          <div class="v-btn" id="btn-left">◀</div>
          <div class="v-btn" id="btn-jump">JUMP</div>
          <div class="v-btn" id="btn-right">▶</div>
      </div>
  </div>

</div>

<script>
  document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function(event) { event.preventDefault(); }, { passive: false });

  const player = document.getElementById('player');
  const world = document.getElementById('world');
  const topWallContainer = document.getElementById('top-wall-container');
  const bottomWallContainer = document.getElementById('bottom-wall-container');
  const thrombusContainer = document.getElementById('thrombus-container');
  const lightZonesContainer = document.getElementById('light-zones-container');
  const coinsContainer = document.getElementById('coins-container');
  const particlesContainer = document.getElementById('particles-container');
  const effectsMask = document.getElementById('effects-mask');
  
  let targetPlayerX = 150; 
  let playerX = 150; 
  let isJumping = false;
  let minPlayerX = 50; 
  let maxAllowedX = 5000; 
  
  let isMovingLeft = false;
  let isMovingRight = false;
  
  const CELL_WIDTH = 130; 
  const CELLS_BETWEEN_NODES = 2; 
  const NODE_SPACING = CELL_WIDTH * CELLS_BETWEEN_NODES; 
  const START_OFFSET = CELL_WIDTH; 
  let WORLD_MAX_WIDTH = 5000;
  
  const nodesData = []; const coinsData = [];

  window.addEventListener('message', (event) => {
      if (event.data.type === 'RENDER_MAP') {
          const isAdv = event.data.mode === 'advanced';
          document.documentElement.style.setProperty('--current-theme', isAdv ? 'var(--theme-adv)' : 'var(--theme-beg)');
          document.documentElement.style.setProperty('--current-glow', isAdv ? 'var(--theme-adv-glow)' : 'var(--theme-beg-glow)');

          let activeIdx = event.data.activeIndex !== undefined ? event.data.activeIndex : (event.data.progressIndex || 0);
          let isCleared = event.data.allCleared || false;
          let safeCoins = event.data.collectedCoins || [];
          let lastPlayedIdx = event.data.lastPlayedIndex; 
          
          buildWorld(event.data.baseSeq, safeCoins, activeIdx, isCleared, lastPlayedIdx);
      }
  });

  window.onload = () => {
      setTimeout(() => { if (nodesData.length === 0) autoBuildWorld(); }, 500); 
      setupVirtualControls();
      requestAnimationFrame(gameLoop);
      window.parent.postMessage({ type: 'GHIBLI_HUB_READY' }, '*');
  };

  function autoBuildWorld() {
      let savedMode = 'beginner'; let savedProg = 0; let scoresBeg = new Map(); let scoresAdv = new Map();
      try {
          const saved = localStorage.getItem('BrainPioneer_SaveData_v9.7');
          if (saved) {
              const p = JSON.parse(saved);
              if (p.mode) savedMode = p.mode;
              if (p.storyProgression) savedProg = p.storyProgression;
              if (p.taskScoresBeg) scoresBeg = new Map(p.taskScoresBeg);
              if (p.taskScoresAdv) scoresAdv = new Map(p.taskScoresAdv);
          }
      } catch(e) {}

      const isAdv = savedMode === 'advanced';
      document.documentElement.style.setProperty('--current-theme', isAdv ? 'var(--theme-adv)' : 'var(--theme-beg)');
      document.documentElement.style.setProperty('--current-glow', isAdv ? 'var(--theme-adv-glow)' : 'var(--theme-beg-glow)');

      const dummyTasks = [
          { roleId: 'r1', category: '中風補習班', title: '什麼是腦中風？' },
          { roleId: 'r1', category: '中風補習班', title: '認識中風團隊人員' },
          { roleId: 'r2', category: '神經科', title: '安排CT' },
          { roleId: 'r2', category: '神經科', title: '血栓溶解' },
          { roleId: 'r3', category: '復健科', title: '物理治療' }
      ];

      let flatTasks = [];
      let globalIdx = 0;
      dummyTasks.forEach((t, idx) => {
          let isCleared = savedMode === 'advanced' ? scoresAdv.has(`${t.roleId}_${idx}`) : scoresBeg.has(`${t.roleId}_${idx}`);
          let status = isCleared ? 'cleared' : (savedProg === globalIdx ? 'active' : 'locked');
          flatTasks.push({ ...t, taskIdx: idx, globalIdx: globalIdx, status: status });
          globalIdx++;
      });

      let activeIndex = flatTasks.findIndex(t => t.status === 'active');
      if (activeIndex === -1) activeIndex = flatTasks.length; 

      buildWorld(flatTasks, [], activeIndex, activeIndex === flatTasks.length, null);
  }

  function buildWorld(baseSeq, collectedCoins, activeIndex, allCleared, lastPlayedIdx) {
      if (!baseSeq || baseSeq.length === 0) return;

      topWallContainer.innerHTML = ''; bottomWallContainer.innerHTML = ''; 
      thrombusContainer.innerHTML = ''; lightZonesContainer.innerHTML = ''; coinsContainer.innerHTML = '';
      nodesData.length = 0; coinsData.length = 0;

      const TOTAL_NODES = baseSeq.length; 
      const totalCellsNeeded = 1 + (TOTAL_NODES * CELLS_BETWEEN_NODES) + 2; 
      WORLD_MAX_WIDTH = totalCellsNeeded * CELL_WIDTH;
      world.style.width = WORLD_MAX_WIDTH + 'px';
      
      minPlayerX = 50; 
      
      if (allCleared || activeIndex >= TOTAL_NODES) {
          maxAllowedX = WORLD_MAX_WIDTH - 100; 
      } else {
          maxAllowedX = START_OFFSET + activeIndex * NODE_SPACING + CELL_WIDTH + 20; 
      }

      let taskMap = {}; 
      baseSeq.forEach((t, i) => { taskMap[START_OFFSET + i * NODE_SPACING] = { task: t, index: i }; });

      for (let i = 0; i < totalCellsNeeded; i++) {
          const cellX = i * CELL_WIDTH;
          
          // 1. 下方細胞 (只留關卡名稱)
          const bCell = document.createElement('div');
          bCell.className = 'endo-cell bottom'; bCell.style.left = cellX + 'px';
          
          if (taskMap[cellX]) {
              const tData = taskMap[cellX]; const t = tData.task;
              let titleColor = (t.status === 'locked') ? '#757575' : ((t.status === 'cleared') ? '#fff' : 'var(--current-theme)');
              bCell.innerHTML = `<div class="cell-text-title" style="color:${titleColor}">${t.title || '任務'}</div>`;
          }
          bottomWallContainer.appendChild(bCell);

          // 2. 上方細胞 (關卡節點)
          if (taskMap[cellX]) {
              const tData = taskMap[cellX]; const t = tData.task; 
              const displayNum = t.taskIdx + 1; // 該類別中的第 1~5 關

              const node = document.createElement('div');
              node.className = 'endo-cell top cell-node'; node.style.left = cellX + 'px';
              
              if (t.status === 'cleared') {
                  node.classList.add('node-cleared');
                  node.style.color = "#000";
              }
              else if (t.status === 'active' || t.status === 'unlocked') node.classList.add('node-active');
              else node.classList.add('node-locked');

              // ★ 上方顯示類別與第幾關 (無圖示)
              node.innerHTML = `
                  <div style="font-size: 10px; opacity: 0.8; margin-bottom: 2px;">${t.category || '演練'}</div>
                  <div style="font-size: 15px; font-weight: 900; letter-spacing: 1px;">第 ${displayNum} 關</div>
              `;
              topWallContainer.appendChild(node);
              nodesData.push({ x: cellX, element: node, itemData: t });

              if (tData.index < TOTAL_NODES - 1) {
                  const trbX = cellX + CELL_WIDTH + 35; 
                  const thrombus = document.createElement('div');
                  thrombus.className = 'thrombus-block'; 
                  thrombus.style.left = trbX + 'px';
                  thrombus.id = `thrombus-${tData.index}`; 
                  
                  let isJustCleared = (lastPlayedIdx !== null && lastPlayedIdx === tData.index && t.status === 'cleared');
                  
                  if (t.status === 'cleared' && !isJustCleared) {
                      thrombus.classList.add('thrombus-cleared');
                      const lightZone = document.createElement('div');
                      lightZone.className = 'cleared-light-zone'; lightZone.style.left = cellX + 'px'; lightZone.style.width = NODE_SPACING + 'px';
                      lightZonesContainer.appendChild(lightZone);
                  }
                  thrombusContainer.appendChild(thrombus);
              }
          } else {
              const tCell = document.createElement('div');
              tCell.className = 'endo-cell top'; tCell.style.left = cellX + 'px';
              topWallContainer.appendChild(tCell);
          }
      }

      let coinLocations = [ {x: START_OFFSET + 150}, {x: START_OFFSET + NODE_SPACING + 150} ]; 
      coinLocations.forEach((loc, index) => {
          if (!collectedCoins.includes(index) && loc.x < START_OFFSET + activeIndex * NODE_SPACING) {
              const coin = document.createElement('div'); coin.className = 'health-coin'; coin.innerText = '$';
              coin.style.left = loc.x + 'px'; coin.style.bottom = `40%`; 
              coinsContainer.appendChild(coin);
              coinsData.push({ id: index, x: loc.x, yPx: window.innerHeight * 0.4, element: coin, isCollected: false });
          }
      });

      let finalBrightLimit = (allCleared || activeIndex >= TOTAL_NODES) ? WORLD_MAX_WIDTH : (START_OFFSET + activeIndex * NODE_SPACING + CELL_WIDTH + 60);
      let initialBrightLimit = finalBrightLimit;

      // === 過關動畫時間軸 ===
      if (lastPlayedIdx !== undefined && lastPlayedIdx !== null) {
          initialBrightLimit = START_OFFSET + lastPlayedIdx * NODE_SPACING + CELL_WIDTH + 60;
          let startDropX = (START_OFFSET + lastPlayedIdx * NODE_SPACING) + 30;
          targetPlayerX = startDropX; playerX = startDropX;
          
          setTimeout(() => {
              
              const thrombusToClear = document.getElementById(`thrombus-${lastPlayedIdx}`);
              if (thrombusToClear) thrombusToClear.classList.add('thrombus-cleared');
              
              const lightZone = document.createElement('div');
              lightZone.className = 'cleared-light-zone'; 
              lightZone.style.left = (START_OFFSET + lastPlayedIdx * NODE_SPACING) + 'px'; 
              lightZone.style.width = NODE_SPACING + 'px';
              lightZone.style.opacity = 0;
              lightZonesContainer.appendChild(lightZone);
              setTimeout(() => lightZone.style.opacity = 1, 50);

              effectsMask.style.clipPath = `polygon(0 0, ${finalBrightLimit}px 0, ${finalBrightLimit}px 100%, 0 100%)`;

              setTimeout(() => {
                  let finalTargetX = (START_OFFSET + activeIndex * NODE_SPACING) + 30; 
                  if (activeIndex >= TOTAL_NODES) finalTargetX = START_OFFSET + (TOTAL_NODES - 1) * NODE_SPACING + 30; 
                  targetPlayerX = finalTargetX; 
                  generateFastRBCs(startDropX, finalTargetX); 
              }, 1500); 
              
          }, 1500); 
      } else {
          activeIndex = parseInt(activeIndex) || 0;
          let finalTargetX = (START_OFFSET + activeIndex * NODE_SPACING) + 30; 
          if (activeIndex >= TOTAL_NODES) finalTargetX = START_OFFSET + (TOTAL_NODES - 1) * NODE_SPACING + 30; 
          targetPlayerX = finalTargetX; playerX = targetPlayerX;
      }

      effectsMask.style.clipPath = `polygon(0 0, ${initialBrightLimit}px 0, ${initialBrightLimit}px 100%, 0 100%)`;
      generateParticles(WORLD_MAX_WIDTH); 
  }

  function setupVirtualControls() {
      const btnLeft = document.getElementById('btn-left');
      const btnRight = document.getElementById('btn-right');
      const btnJump = document.getElementById('btn-jump');

      const addHoldEvent = (el, setTrue, setFalse) => {
          el.addEventListener('pointerdown', (e) => { e.preventDefault(); setTrue(); });
          el.addEventListener('pointerup', (e) => { e.preventDefault(); setFalse(); });
          el.addEventListener('pointercancel', (e) => { e.preventDefault(); setFalse(); });
          el.addEventListener('pointerleave', (e) => { e.preventDefault(); setFalse(); });
      };

      addHoldEvent(btnLeft, () => isMovingLeft = true, () => isMovingLeft = false);
      addHoldEvent(btnRight, () => isMovingRight = true, () => isMovingRight = false);

      btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
  }

  function gameLoop() {
      if (isMovingLeft) targetPlayerX -= 8;
      if (isMovingRight) targetPlayerX += 8;
      
      if (targetPlayerX < minPlayerX) targetPlayerX = minPlayerX; 
      if (targetPlayerX > maxAllowedX) targetPlayerX = maxAllowedX; 

      if (!isNaN(targetPlayerX)) {
          playerX += (targetPlayerX - playerX) * 0.15; 
          
          let camX = (window.innerWidth / 2) - playerX - 20; 
          if (camX > 0) camX = 0; 
          const maxScroll = -(WORLD_MAX_WIDTH - window.innerWidth + 100);
          if (camX < maxScroll) camX = maxScroll;
          
          world.style.transform = `translate3d(${camX}px, 0, 0)`;
          player.style.left = `${playerX}px`;
      }
      
      requestAnimationFrame(gameLoop);
  }

  function jump() {
      if (isJumping) return;
      isJumping = true;
      
      // 動態計算最佳跳躍高度 (不管手機大小，必定能碰到上方細胞)
      const viewportHeight = document.getElementById('bv-viewport').offsetHeight;
      // 空腔高度是 viewportHeight - (50+50)*2 = viewportHeight - 200
      // 扣除膠囊高度 45px，跳躍距離需涵蓋此空缺
      let jumpDistance = viewportHeight - 200 - 45 + 15; // 15px 容錯值
      if (jumpDistance < 90) jumpDistance = 90; 
      
      player.style.transform = `translateY(-${jumpDistance}px) scale(1.2)`;
      
      setTimeout(() => {
          nodesData.forEach(b => {
              if (Math.abs((playerX + 14) - (b.x + 65)) < 70) {
                  b.element.classList.add('active-hit'); 

                  setTimeout(() => {
                      window.parent.postMessage({
                          type: 'HUB_NODE_CLICK',
                          nodeType: 'task', roleId: b.itemData.roleId,
                          taskIdx: b.itemData.taskIdx, globalIdx: b.itemData.globalIdx, status: b.itemData.status
                      }, '*');
                      b.element.classList.remove('active-hit'); 
                  }, 400);
              }
          });
      }, 300);

      setTimeout(() => {
          player.style.transform = 'translateY(0) scale(1)';
          setTimeout(() => { isJumping = false; }, 150); // ★ 縮短重置延時
      }, 400); // ★ 縮短下降延時
  }

  function generateParticles(brightLimitX) {
      const pContainer = document.getElementById('particles-container');
      pContainer.innerHTML = '';
      
      for(let i=0; i<15; i++) { 
          const rbc = document.createElement('div'); rbc.className = 'red-blood-cell rbc-slow'; 
          rbc.style.left = `${Math.random() * brightLimitX}px`;
          rbc.style.top = `${30 + Math.random() * 35}%`; /* ★ 調整生成範圍 */
          const size = 15 + Math.random() * 20; rbc.style.width = `${size}px`; rbc.style.height = `${size}px`; 
          rbc.style.animationDuration = `${10 + Math.random() * 10}s`; rbc.style.animationDelay = `-${Math.random() * 10}s`; 
          pContainer.appendChild(rbc); 
      }
  }

  function generateFastRBCs(startX, endX) {
      for(let i=0; i<10; i++) {
          setTimeout(() => {
              const rbc = document.createElement('div'); rbc.className = 'red-blood-cell rbc-fast'; 
              rbc.style.left = `${startX - 100}px`; 
              rbc.style.top = `${40 + Math.random() * 25}%`; /* ★ 調整生成範圍 */
              rbc.style.animationDuration = `${1 + Math.random() * 1}s`; 
              document.getElementById('particles-container').appendChild(rbc);
              setTimeout(() => { if (rbc.parentNode) rbc.parentNode.removeChild(rbc); }, 3000);
          }, i * 200);
      }
  }
</script>
</body>
</html>
