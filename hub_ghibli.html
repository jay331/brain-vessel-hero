<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>吉卜力大廳引擎</title>
<style>
  :root {
    --sky-top: #5c9dd6; --sky-bottom: #d4f0ff;
    --ocean-top: #3a8fb7; --ocean-bottom: #0e3d59;
    --grass-light: #8bcd50; --grass-dark: #62a326;
    --dirt: #7a5c43; --stone: #9ea7a6;
    --coin-gold: #ffd700;
  }
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; font-family: "PingFang TC", sans-serif; }
  
  #game-window { position: relative; width: 100%; height: 100%; background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 60%); overflow: hidden; }
  #world { position: absolute; left: 0; top: 0; height: 100%; transition: transform 0.1s ease-out; }
  
  #screen-effects { position: absolute; inset: 0; pointer-events: none; z-index: 15; }
  .wind-line { position: absolute; height: 2px; background: rgba(255,255,255,0.4); border-radius: 2px; animation: blowRight linear infinite; }
  @keyframes blowRight { 0% { transform: translateX(-20vw); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(100vw); opacity: 0; } }
  
  #bubbles-container { position: absolute; bottom: 0; width: 100%; height: 25%; pointer-events: none; z-index: 14; overflow: hidden; }
  .bubble { position: absolute; background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.6); border-radius: 50%; animation: floatUp ease-in infinite; }
  @keyframes floatUp { 0% { transform: translateY(0px) scale(0.5); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }

  .cloud { position: absolute; background: rgba(255,255,255,0.85); border-radius: 50px; filter: blur(2px); animation: floatCloud ease-in-out infinite alternate; }
  @keyframes floatCloud { 0% { transform: translateX(0px); } 100% { transform: translateX(50px); } }
  
  .cliff { position: absolute; bottom: 25%; width: 100%; height: 50px; background: linear-gradient(to bottom, var(--grass-light) 0%, var(--grass-dark) 40%, var(--dirt) 40%, #4a3626 100%); border-top: 3px solid #bdf285; z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
  .ocean { position: absolute; bottom: 0; width: 100%; height: 25%; background: linear-gradient(to bottom, var(--ocean-top) 0%, var(--ocean-bottom) 100%); z-index: 5; opacity: 0.85; border-top: 4px solid rgba(255,255,255,0.4); }
  .coral { position: absolute; bottom: -5px; z-index: 4; transform-origin: bottom center; animation: sway 8s ease-in-out infinite alternate; }
  @keyframes sway { 0% { transform: rotate(-3deg); } 100% { transform: rotate(3deg); } }

  .bird { position: absolute; z-index: 2; font-size: 35px; filter: drop-shadow(2px 5px 8px rgba(0,0,0,0.3)); }
  @keyframes flyWave { 0% { transform: translate(-100px, 0) scaleX(-1); } 25% { transform: translate(2500px, -60px) scaleX(-1); } 50% { transform: translate(5000px, 30px) scaleX(-1); } 75% { transform: translate(7500px, -40px) scaleX(-1); } 100% { transform: translate(10000px, 0) scaleX(-1); } }
  @keyframes flySwoop { 0% { transform: translate(-100px, -50px) scaleX(-1); } 20% { transform: translate(2000px, 80px) scaleX(-1); } 50% { transform: translate(5000px, -30px) scaleX(-1); } 80% { transform: translate(8000px, 70px) scaleX(-1); } 100% { transform: translate(10000px, -50px) scaleX(-1); } }
  
  .fish { position: absolute; z-index: 6; font-size: 45px; animation: swimLeft linear infinite; }
  @keyframes swimLeft { 0% { transform: translateX(10000px) scaleX(1); } 100% { transform: translateX(-200px) scaleX(1); } }
  
  .vine { position: absolute; bottom: calc(25% + 215px); height: 40px; border-bottom: 4px solid #4a7c2a; border-radius: 50%; z-index: 9; opacity: 0.8; }
  
  .floating-island { 
    position: absolute; bottom: calc(25% + 200px); width: 75px; height: 65px; border-radius: 45% 55% 40% 60%; 
    background: radial-gradient(circle at 30% 30%, #a8e6cf 0%, #3d8c40 70%, #2a592c 100%); 
    box-shadow: 0 10px 15px rgba(0,0,0,0.3), inset -6px -6px 12px rgba(0,0,0,0.4), inset 3px 3px 8px rgba(255,255,255,0.2); 
    display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px #000; 
    transition: box-shadow 0.2s, background 0.2s; animation: floatUpDown 4s ease-in-out infinite alternate; z-index: 10; text-align: center; line-height: 1.2;
  }
  @keyframes floatUpDown { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
  
  /* === 新增的關卡狀態與 UI === */
  .island-locked { filter: grayscale(100%) brightness(0.6); }
  
  /* 已通關的金色石頭 */
  .island-cleared {
    background: radial-gradient(circle at 30% 30%, #fff9c4 0%, #ffd54f 70%, #f57f17 100%) !important;
    box-shadow: 0 10px 15px rgba(0,0,0,0.3), inset -6px -6px 12px rgba(180,100,0,0.5), inset 3px 3px 8px rgba(255,255,255,0.7) !important;
    color: #4e342e !important; text-shadow: 1px 1px 0px rgba(255,255,255,0.5) !important;
  }

  .island-active { animation: activePulse 2s infinite ease-in-out; }
  @keyframes activePulse { 
      0% { box-shadow: 0 10px 15px rgba(0,0,0,0.3), inset -6px -6px 12px rgba(0,0,0,0.4); transform: translateY(0); } 
      50% { box-shadow: 0 0 30px #ffeb3b, inset -6px -6px 12px rgba(0,0,0,0.4); transform: translateY(-5px); border: 2px solid rgba(255,255,255,0.5); } 
      100% { box-shadow: 0 10px 15px rgba(0,0,0,0.3), inset -6px -6px 12px rgba(0,0,0,0.4); transform: translateY(0); } 
  }
  .active-hit { box-shadow: 0 0 30px #ffeb3b, inset -4px -4px 10px rgba(180,120,0,0.5) !important; background: radial-gradient(circle at 30% 30%, #fff59d 0%, #fbc02d 70%, #f57f17 100%) !important; transform: translateY(-15px) !important; animation: none !important; }
  
  .level-label { position: absolute; top: -35px; white-space: nowrap; background: rgba(0,0,0,0.6); color: #fff; padding: 4px 8px; border-radius: 10px; font-size: 12px; opacity: 0; }
  .active-hit .level-label, .island-active .level-label { opacity: 1; }

  /* 關卡上方的類別文字 */
  .level-category-top {
      position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #fff; background: rgba(0,0,0,0.7); padding: 3px 6px; border-radius: 4px;
      white-space: nowrap; pointer-events: none; border: 1px solid rgba(255,255,255,0.3);
  }

  /* 關卡下方的標題文字 */
  .level-title-bottom {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
      width: 140px; text-align: center; color: #e0f7fa; font-size: 11px;
      text-shadow: 1px 1px 3px #000, 0 0 8px rgba(0,0,0,0.8); font-weight: bold; line-height: 1.2; word-break: break-word; pointer-events: none;
  }

  /* 進行中關卡的綠色跳動箭頭 */
  .active-arrow {
      position: absolute; top: -65px; left: 50%; transform: translateX(-50%);
      font-size: 26px; color: #3dff8e; text-shadow: 0 4px 6px rgba(0,0,0,0.8);
      animation: bounceArrow 0.8s infinite alternate ease-in-out; pointer-events: none; z-index: 20;
  }
  @keyframes bounceArrow { 0% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, 10px); } }

  #player { position: absolute; left: 150px; bottom: calc(25% + 50px); width: 40px; height: 60px; z-index: 20; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .player-head { width: 30px; height: 30px; background: #ffe0b2; border: 2px solid #555; border-radius: 50%; margin: 0 auto; position: relative; }
  .player-body { width: 40px; height: 30px; background: #e3f2fd; border: 2px solid #555; border-radius: 10px 10px 5px 5px; margin-top: -2px; }

  .health-coin { position: absolute; width: 35px; height: 35px; background-color: var(--coin-gold); border: 3px solid #b8860b; border-radius: 50%; z-index: 15; display: flex; align-items: center; justify-content: center; color: #8b4513; font-weight: bold; font-size: 18px; box-shadow: 0 0 10px rgba(255,215,0,0.7), inset 2px 2px 5px rgba(255,255,255,0.6); animation: rotateCoin 2s linear infinite, floatCoin 1.5s ease-in-out infinite alternate; }
  @keyframes rotateCoin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
  @keyframes floatCoin { 0% { margin-top: 0px; } 100% { margin-top: -8px; } }
  .health-coin.collected { animation: collectEffect 0.5s ease-out forwards; pointer-events: none; }
  @keyframes collectEffect { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }
</style>
</head>
<body>

<div id="game-window">
  <div id="screen-effects"></div><div id="bubbles-container"></div>
  <div id="world">
    <div id="clouds-container"></div><div class="cliff"></div><div class="ocean" id="ocean-container"></div>
    <div id="creatures-container"></div><div id="vines-container"></div><div id="bricks-container"></div><div id="coins-container"></div>
    <div id="player"><div class="player-head"></div><div class="player-body"></div></div>
  </div>
</div>

<script>
  const player = document.getElementById('player');
  const world = document.getElementById('world');
  const bricksContainer = document.getElementById('bricks-container');
  const vinesContainer = document.getElementById('vines-container');
  const coinsContainer = document.getElementById('coins-container');
  
  let playerX = 150; let isDragging = false; let startClientX = 0; let startPlayerX = 0; let isJumping = false;
  let minPlayerX = 50; // 控制畫面能否往左滑的邊界限制
  
  const LEVEL_SPACING = 160; const START_OFFSET = 300; 
  let TOTAL_CYCLES = 4; let WORLD_MAX_WIDTH = 5000;
  
  const bricksData = []; const coinsData = [];

  // =========================================
  // 接收主程式傳來的地圖資料
  // =========================================
  window.addEventListener('message', (event) => {
      if (event.data.type === 'RENDER_MAP') {
          buildWorld(event.data.baseSeq, event.data.collectedCoins, event.data.activeIndex, event.data.allCleared);
      }
  });

  window.onload = () => {
      generateEnvironment();
      window.parent.postMessage({ type: 'GHIBLI_HUB_READY' }, '*');
  };

  // =========================================
  // 構建關卡
  // =========================================
  function buildWorld(baseSeq, collectedCoins, activeIndex, allCleared) {
      bricksContainer.innerHTML = ''; vinesContainer.innerHTML = ''; coinsContainer.innerHTML = '';
      bricksData.length = 0; coinsData.length = 0;

      const CYCLE_LENGTH = baseSeq.length; 
      const TOTAL_LEVELS = CYCLE_LENGTH * TOTAL_CYCLES; 
      WORLD_MAX_WIDTH = START_OFFSET + TOTAL_LEVELS * LEVEL_SPACING + 500;
      world.style.width = WORLD_MAX_WIDTH + 'px';

      const startCycle = Math.floor(TOTAL_CYCLES / 2);
      
      // 控制畫面邊界：如果還沒全破，不允許滑回前一個循環的尾巴 (卡在第一關之前)
      minPlayerX = allCleared ? 50 : (START_OFFSET + startCycle * CYCLE_LENGTH * LEVEL_SPACING - 50);

      for (let i = 0; i < TOTAL_LEVELS; i++) {
          const bX = START_OFFSET + i * LEVEL_SPACING;
          const cycleIndex = i % CYCLE_LENGTH; 
          const item = baseSeq[cycleIndex]; 
          
          const island = document.createElement('div');
          island.className = 'floating-island';
          island.style.left = bX + 'px'; 
          island.style.animationDelay = `-${Math.random() * 3}s`;
          
          let innerHTMLStr = '';

          // 判斷是否為當前進行中關卡 (只在當前循環繪製綠色箭頭)
          if (i === startCycle * CYCLE_LENGTH + activeIndex) {
              innerHTMLStr += `<div class="active-arrow">⬇</div>`;
          }
          
          let isRandom = false;
          if (item.type === 'task') {
              // 賦予狀態樣式 (已通關為金色)
              if (item.status === 'cleared') island.classList.add('island-cleared');
              else if (item.status === 'locked') island.classList.add('island-locked');
              
              innerHTMLStr += `
                  <div class="level-category-top">${item.category}</div>
                  第 ${item.globalIdx + 1} 關
                  <div class="level-label">準備任務</div>
                  <div class="level-title-bottom">${item.title || ''}</div>
              `;
          } else if (item.type === 'random') {
              island.classList.add('random-level', 'island-active'); 
              innerHTMLStr += `<span class="random-text">隨機</span><div class="level-label">抽籤關卡</div><div class="level-title-bottom">未知的挑戰</div>`;
              isRandom = true;
          } else if (item.type === 'comprehensive') {
              island.classList.add('island-active'); 
              innerHTMLStr += `綜合<div class="level-label">綜合演練</div><div class="level-title-bottom">終極考驗</div>`;
              island.style.background = 'radial-gradient(circle at 30% 30%, #ff8a65 0%, #d84315 70%, #bf360c 100%)';
          }
          
          island.innerHTML = innerHTMLStr;
          bricksContainer.appendChild(island);
          bricksData.push({ x: bX, element: island, itemData: item, isRandom: isRandom, isRollingLocked: false });

          if (i < TOTAL_LEVELS - 1) {
              const vine = document.createElement('div');
              vine.className = 'vine';
              vine.style.left = (bX + 37) + 'px'; vine.style.width = (LEVEL_SPACING) + 'px'; 
              vinesContainer.appendChild(vine);
          }
      }

      const coinLocations = [ {x: 600}, {x: 1400}, {x: 2300}, {x: 3200}, {x: 4100} ];
      coinLocations.forEach((loc, index) => {
          if (!collectedCoins.includes(index)) {
              const coin = document.createElement('div'); coin.className = 'health-coin'; coin.innerText = 'H';
              coin.style.left = loc.x + 'px'; coin.style.bottom = `calc(25% + 70px)`;
              coinsContainer.appendChild(coin);
              coinsData.push({ id: index, x: loc.x, yPx: 70, element: coin, isCollected: false });
          }
      });

      // 人物出生點設定在「進行中關卡」正下方
      const targetGlobalIndex = startCycle * CYCLE_LENGTH + activeIndex;
      playerX = (START_OFFSET + targetGlobalIndex * LEVEL_SPACING) + 17.5; // 置中對齊
      updateCamera();
  }

  // =========================================
  // 物理碰撞與事件
  // =========================================
  function updateCamera() {
      let camX = window.innerWidth * 0.3 - playerX;
      if (camX > 0) camX = 0; 
      const maxScroll = -(WORLD_MAX_WIDTH - window.innerWidth + 200);
      if (camX < maxScroll) camX = maxScroll;
      world.style.transform = `translateX(${camX}px)`;
      player.style.left = `${playerX}px`;
      checkCoinCollisions(0); 
  }

  function jump() {
      if (isJumping) return;
      isJumping = true;
      let jumpHeight = -120; 
      player.style.transform = `translateY(${jumpHeight}px)`;
      
      setTimeout(() => {
          let hitAny = false;
          bricksData.forEach(b => {
              if (Math.abs(playerX + 20 - (b.x + 35)) < 45) {
                  b.element.classList.add('active-hit'); 
                  hitAny = true;
                  
                  if (b.isRandom && !b.isRollingLocked) {
                      b.isRollingLocked = true;
                      let rollCount = 0; const randomText = b.element.querySelector('.random-text'); const levelLabel = b.element.querySelector('.level-label');
                      const rollInterval = setInterval(() => {
                          randomText.innerText = `第 ${Math.floor(Math.random() * 25) + 1} 關`;
                          if (++rollCount >= 20) { 
                              clearInterval(rollInterval);
                              randomText.innerText = `第 ${Math.floor(Math.random() * 25) + 1} 關`; levelLabel.innerText = `抽中！`;
                          }
                      }, 50);
                  }

                  setTimeout(() => {
                      window.parent.postMessage({
                          type: 'HUB_NODE_CLICK',
                          nodeType: b.itemData.type, roleId: b.itemData.roleId,
                          taskIdx: b.itemData.taskIdx, globalIdx: b.itemData.globalIdx, status: b.itemData.status
                      }, '*');
                      b.element.classList.remove('active-hit'); 
                  }, 600);
              } else { 
                  if (!b.isRollingLocked) b.element.classList.remove('active-hit'); 
              }
          });
          if (!hitAny) { bricksData.forEach(b => { if(!b.isRollingLocked) b.element.classList.remove('active-hit'); }); }
          checkCoinCollisions(-jumpHeight);
      }, 200);

      setTimeout(() => {
          player.style.transform = 'translateY(0)';
          setTimeout(() => { isJumping = false; }, 100); 
      }, 400);
  }

  function checkCoinCollisions(playerYOffset) {
      const playerActualY = 50 + playerYOffset; 
      coinsData.forEach(c => {
          if (c.isCollected) return; 
          if (Math.abs(playerX + 20 - (c.x + 17.5)) < 40 && Math.abs(playerActualY - c.yPx) < 40) {
              c.isCollected = true; c.element.classList.add('collected');
              window.parent.postMessage({ type: 'COLLECT_HUB_COIN', coinIndex: c.id }, '*');
              setTimeout(() => { if (c.element.parentNode) c.element.parentNode.removeChild(c.element); }, 500);
          }
      });
  }

  const handleStart = (e) => { isDragging = true; startClientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; startPlayerX = playerX; };
  const handleMove = (e) => { 
      if (!isDragging) return; 
      let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX; 
      let deltaX = clientX - startClientX; 
      playerX = startPlayerX + deltaX * 1.5; 
      
      // 套用畫面邊界限制
      if (playerX < minPlayerX) playerX = minPlayerX; 
      if (playerX > WORLD_MAX_WIDTH) playerX = WORLD_MAX_WIDTH; 
      
      updateCamera(); 
  };
  const handleEnd = (e) => { if (!isDragging) return; isDragging = false; let clientX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX; if (Math.abs(clientX - startClientX) < 10) jump(); };

  const interactArea = document.getElementById('game-window');
  interactArea.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);
  interactArea.addEventListener('touchstart', handleStart, { passive: false }); window.addEventListener('touchmove', handleMove, { passive: false }); window.addEventListener('touchend', handleEnd);
  window.addEventListener('resize', updateCamera);

  // =========================================
  // 生成背景環境
  // =========================================
  function generateEnvironment() {
      const screenEffects = document.getElementById('screen-effects'); const bubblesContainer = document.getElementById('bubbles-container');
      for(let i=0; i<4; i++) { const wind = document.createElement('div'); wind.className = 'wind-line'; wind.style.top = `${Math.random() * 45}%`; wind.style.width = `${100 + Math.random() * 200}px`; wind.style.animationDuration = `${12 + Math.random() * 10}s`; wind.style.animationDelay = `-${Math.random() * 10}s`; screenEffects.appendChild(wind); }
      for(let i=0; i<8; i++) { const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.style.left = `${Math.random() * 100}%`; bubble.style.bottom = `${Math.random() * 20}%`; const size = 5 + Math.random() * 10; bubble.style.width = `${size}px`; bubble.style.height = `${size}px`; bubble.style.animationDuration = `${6 + Math.random() * 6}s`; bubble.style.animationDelay = `-${Math.random() * 6}s`; bubblesContainer.appendChild(bubble); }
      
      const MAX_W = 20000; const oceanContainer = document.getElementById('ocean-container');
      for(let i = 0; i < Math.floor(MAX_W/300); i++) { const cloud = document.createElement('div'); cloud.className = 'cloud'; cloud.style.left = `${(i * 300) + Math.random() * 150}px`; cloud.style.top = `${Math.random() * 35}%`; cloud.style.width = `${80 + Math.random() * 150}px`; cloud.style.height = `${20 + Math.random() * 40}px`; cloud.style.opacity = 0.4 + Math.random() * 0.4; cloud.style.animationDuration = `${40 + Math.random() * 40}s`; document.getElementById('clouds-container').appendChild(cloud); }
      const coralEmojis = ['🪸', '🌿', '🌱', '🦀']; 
      for (let i = 0; i < Math.floor(MAX_W/300); i++) { const coral = document.createElement('div'); coral.className = 'coral'; const type = coralEmojis[Math.floor(Math.random() * coralEmojis.length)]; coral.innerText = type; coral.style.left = `${(i * 300) + Math.random() * 150}px`; coral.style.fontSize = '40px'; if (type === '🌿' || type === '🌱') { coral.style.transform = `scale(${0.8 + Math.random() * 0.4}, ${1.5 + Math.random() * 2.0})`; coral.style.filter = `hue-rotate(${Math.random() * 90 - 45}deg) drop-shadow(2px 2px 4px rgba(0,0,0,0.5))`; } else { coral.style.transform = `scale(${0.7 + Math.random() * 0.6})`; coral.style.filter = `hue-rotate(${Math.random() * 360}deg) drop-shadow(2px 2px 4px rgba(0,0,0,0.5))`; } coral.style.opacity = 0.85; coral.style.animationDelay = `-${Math.random() * 5}s`; oceanContainer.appendChild(coral); }
      
      const creaturesContainer = document.getElementById('creatures-container');
      for (let i = 0; i < 12; i++) { 
          const isFlock = Math.random() > 0.6; const flockSize = isFlock ? (Math.random() > 0.5 ? 2 : 3) : 1; 
          const baseX = Math.random() * MAX_W; const baseY = Math.random() * 20 + 2; const animName = Math.random() > 0.5 ? 'flyWave' : 'flySwoop'; 
          const duration = 100 + Math.random() * 100; const delay = -(Math.random() * 200); 
          for (let j = 0; j < flockSize; j++) { 
              const bird = document.createElement('div'); bird.className = 'bird'; bird.innerText = ['🦅', '🕊️'][Math.floor(Math.random() * 2)]; 
              bird.style.left = `${baseX + j * (80 + Math.random() * 40)}px`; bird.style.top = `calc(${baseY}% + ${j * (10 - Math.random() * 20)}px)`; 
              bird.style.animationName = animName; bird.style.animationTimingFunction = 'linear'; bird.style.animationIterationCount = 'infinite'; 
              bird.style.animationDuration = `${duration}s`; bird.style.animationDelay = `${delay}s`; creaturesContainer.appendChild(bird); 
          } 
      }
      
      for (let i = 0; i < 18; i++) { 
          const isSchool = Math.random() > 0.5; const schoolSize = isSchool ? Math.floor(Math.random() * 3) + 2 : 1; 
          const baseX = Math.random() * MAX_W; const baseY = Math.random() * 40 + 10; 
          const duration = 240 + Math.random() * 150; const delay = -(Math.random() * 300); const baseHue = Math.floor(Math.random() * 360); 
          for (let j = 0; j < schoolSize; j++) { 
              const fish = document.createElement('div'); fish.className = 'fish'; fish.innerText = ['🐠', '🐡', '🐟', '🪼', '🦑'][Math.floor(Math.random() * 5)]; 
              fish.style.left = `${baseX + j * (80 + Math.random() * 50)}px`; fish.style.top = `calc(${baseY}% + ${j * (20 - Math.random() * 40)}px)`; 
              fish.style.animationDuration = `${duration}s`; fish.style.animationDelay = `${delay}s`; 
              const scale = 0.5 + Math.random() * 0.5; fish.style.transform = `scale(${scale})`; fish.style.filter = `drop-shadow(3px 6px 10px rgba(0,0,0,0.5)) hue-rotate(${baseHue + (j*15)}deg)`; fish.style.opacity = scale; oceanContainer.appendChild(fish); 
          } 
      }
  }
</script>
</body>
</html>
